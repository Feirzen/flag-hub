<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Claude OS Backgrounds</title>
<meta name="robots" content="noindex">
<style>
  :root { --text: #f2f3fa; }
  html, body { height: 100%; margin: 0; background: #06070d; color: var(--text); overflow: hidden;
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; transition: opacity .65s ease; }
  body.bg-swap #gl { opacity: 0; }
  .bar { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 8px; }
  button { font: inherit; color: inherit; border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 10px 18px; cursor: pointer;
    background: rgba(22,24,38,.32); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255,255,255,.22); }
  .tip { position: fixed; top: max(16px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font-size: 13px; color: rgba(255,255,255,.6); }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="tip">Tap a button to flip through every background. "Mood" previews how Focus slows and dims it.</div>
<div class="bar"><button id="next">Next</button><button id="mood">Mood: normal</button><button id="light">Light: off</button></div>
<script src="bg.js?v=4"></script>
<script>
  const B = window.OSBG, all = Object.keys(B.names).filter(k => k !== "prism"); let i = 0, m = 0, l = false;
  const label = () => document.getElementById("next").textContent = "Next  ·  now: " + B.names[all[i]];
  B.use(all[i]); label();
  document.getElementById("next").onclick = () => { i = (i + 1) % all.length; B.show(all[i]); setTimeout(label, 700); };
  const moods = [["normal", 1, 1], ["focus", .3, .55], ["break", 1.8, 1.1]];
  document.getElementById("mood").onclick = e => { m = (m + 1) % 3; B.mood(moods[m][1], moods[m][2]); e.target.textContent = "Mood: " + moods[m][0]; };
  document.getElementById("light").onclick = e => { l = !l; B.palette(l ? "light" : "dark", { mode: l ? "light" : "dark", vars: { accent: "#9d8cff" } }); e.target.textContent = "Light: " + (l ? "on" : "off"); };
</script>
</body>
</html>
