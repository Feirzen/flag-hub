<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Claude OS</title>
<meta name="description" content="A desk display for Steven: clock, weather, the day ahead, timers, alarms, flags, and messages from Claude.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Claude OS">
<meta name="theme-color" content="#07080f">
<link rel="icon" href="icons/favicon.svg?v=1" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png?v=1" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=1">
<link rel="manifest" href="manifest.webmanifest?v=1">
<meta property="og:type" content="website">
<meta property="og:title" content="Claude OS">
<meta property="og:description" content="Clock, weather, the day ahead, timers, alarms, and messages from Claude.">
<meta property="og:image" content="https://feirzen.github.io/flag-hub/os/icons/og-image.png?v=1">
<meta property="og:url" content="https://feirzen.github.io/flag-hub/os/">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="os.css?v=1">
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div id="dim" aria-hidden="true"></div>

<main id="ui">
  <section id="left">
    <div id="clock" aria-live="off"><span id="hm">--:--</span><span id="ampm"></span></div>
    <div id="date"></div>
    <button id="wx" class="glass pill" hidden>
      <span id="wxIcon"></span><span id="wxTemp"></span><span id="wxCond"></span><span id="wxHL"></span>
    </button>
    <div id="headline"></div>
    <div id="dock">
      <button class="glass round" id="btnTimer" aria-label="Timer"></button>
      <button class="glass round" id="btnAlarm" aria-label="Alarms"></button>
      <button class="glass round" id="btnSleep" aria-label="Screensaver"></button>
      <div id="chips"></div>
    </div>
  </section>

  <section id="right">
    <nav id="tabs" class="glass">
      <span id="lens"></span>
      <button data-tab="today" class="on">Today</button>
      <button data-tab="inbox">Inbox<i id="badge" hidden></i></button>
      <button data-tab="flags">Flags</button>
    </nav>
    <div id="card" class="glass">
      <div class="pane on" id="pane-today"></div>
      <div class="pane" id="pane-inbox"></div>
      <div class="pane" id="pane-flags"></div>
    </div>
  </section>

  <button id="gear" class="glass round" aria-label="Settings"></button>
  <div id="net" hidden>offline</div>
</main>

<div id="sheetBack" hidden><div id="sheet" class="glass" role="dialog" aria-modal="true"></div></div>
<div id="ring" hidden></div>
<div id="gate"></div>

<script src="os.js?v=1"></script>
<script src="https://feirzen.github.io/flag-hub/kit/kit.js" data-app="claude-os" data-name="Claude OS" data-longpress="off" defer></script>
</body>
</html>
